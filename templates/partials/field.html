{# Ein Formularfeld: include 'partials/field.html' with f=form.feldname #}
{% if f.field.widget.input_type == 'checkbox' %}
  <label class="flex items-start gap-2 text-sm text-slate-700">
    <input type="checkbox" name="{{ f.html_name }}" id="{{ f.id_for_label }}" class="mt-0.5 h-4 w-4 accent-orange-600" {% if f.value %}checked{% endif %}>
    <span>{{ f.label }}{% if f.help_text %}<span class="hint">{{ f.help_text }}</span>{% endif %}</span>
  </label>
{% else %}
  <label class="block" for="{{ f.id_for_label }}">
    <span class="lbl">{{ f.label }}{% if f.field.required %} <span class="text-orange-600">*</span>{% endif %}</span>
    {{ f }}
    {% if f.help_text %}<span class="hint">{{ f.help_text }}</span>{% endif %}
  </label>
{% endif %}
{% for e in f.errors %}<p class="mt-1 text-xs text-red-600">{{ e }}</p>{% endfor %}
