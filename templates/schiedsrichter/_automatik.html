{% if auto.km_laeuft %}
  <div class="mb-4 flex items-center gap-3 rounded-lg border border-sky-200 bg-sky-50 px-4 py-2.5 text-sm text-sky-900">
    <span class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-sky-300 border-t-sky-700"></span>
    Fahrt-km werden automatisch aus deiner Adresse und den Hallenadressen berechnet – die Seite aktualisiert sich gleich.
  </div>
  <script>setTimeout(() => location.reload(), 6000);</script>
{% elif ohne_adresse %}
  <div class="mb-4 rounded-lg border border-amber-200 bg-amber-50 px-4 py-2.5 text-sm text-amber-900">
    Für die automatische km-Berechnung fehlt deine Wohnadresse. <a class="link" href="{% url 'einstellungen' %}">Jetzt in den Einstellungen eintragen →</a>
  </div>
{% endif %}
