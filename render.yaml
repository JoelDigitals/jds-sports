# Render Blueprint: Web-Service + PostgreSQL (Dashboard → New → Blueprint)
databases:
  - name: jds-sports-db
    plan: free
    databaseName: jds_sports
    user: jds_sports

services:
  - type: web
    name: jds-sports
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: jds-sports-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      # Mailjet + Absender im Render-Dashboard eintragen (nicht ins Repo!)
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: JDS Sports <no-reply@joel-digitals.com>
