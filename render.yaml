# Render Blueprint: Web-Service (Datenbank: Supabase PostgreSQL, URL im Dashboard als DATABASE_URL setzen)
services:
  - type: web
    name: jds-sports
    runtime: python
    plan: free
    # gleiche Region wie die Datenbank (Supabase eu-central-1 = Frankfurt) – jede Abfrage ist sonst ein Transatlantik-Roundtrip
    region: frankfurt
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        sync: false  # Supabase-Pooler-URL (postgresql://…:6543/postgres) im Render-Dashboard eintragen
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Mailjet + Absender im Render-Dashboard eintragen (nicht ins Repo!)
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: JDS Sports <no-reply@joel-digitals.com>
