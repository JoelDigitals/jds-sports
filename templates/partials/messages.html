{% if messages %}
  <div class="mb-4 space-y-2">
    {% for m in messages %}
      <div class="rounded-lg border px-4 py-2.5 text-sm
        {% if m.tags == 'error' %}border-red-200 bg-red-50 text-red-800
        {% elif m.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-900
        {% elif m.tags == 'success' %}border-green-200 bg-green-50 text-green-800
        {% else %}border-sky-200 bg-sky-50 text-sky-900{% endif %}">{{ m }}</div>
    {% endfor %}
  </div>
{% endif %}
